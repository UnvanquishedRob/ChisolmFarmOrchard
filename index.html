<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2d5a0e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Orchard">
<meta name="description" content="Fruit tree & berry care guide for Zone 9 / Simonton, TX">
<link rel="manifest" href="manifest.json">
<title>Zone 9 Orchard Guide</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --green-dark: #1a2e0a;
  --green-deep: #2d5a0e;
  --green-mid: #4a8c1c;
  --green-light: #7dc43a;
  --green-pale: #e8f5d0;
  --green-ultra: #f2fae6;
  --amber: #c47a1a;
  --amber-light: #fef3e0;
  --coral: #c04020;
  --coral-light: #fdeee8;
  --teal: #0f6e56;
  --teal-light: #e0f5ef;
  --blue: #1a5fa5;
  --blue-light: #e6f0fb;
  --text: #1a1a1a;
  --text-muted: #5a6a4a;
  --text-faint: #8a9a7a;
  --bg: #f7faf2;
  --bg-card: #ffffff;
  --border: #d4e4b8;
  --radius: 14px;
  --radius-sm: 8px;
  --shadow: 0 2px 8px rgba(45,90,14,0.10);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

@media (prefers-color-scheme: dark) {
  :root {
    --green-dark: #0a1505;
    --green-deep: #1e3d0a;
    --green-mid: #3a6e14;
    --green-light: #6ab830;
    --green-pale: #1a2d0a;
    --green-ultra: #121f07;
    --amber-light: #2a1e05;
    --coral-light: #2a1008;
    --teal-light: #082018;
    --blue-light: #080f1f;
    --text: #e8f2d8;
    --text-muted: #9aae80;
    --text-faint: #6a7e54;
    --bg: #0e1a06;
    --bg-card: #162208;
    --border: #2a4010;
    --shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
}

html, body { height: 100%; overflow: hidden; background: var(--green-dark); }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  color: var(--text);
  background: var(--bg);
  display: flex;
  flex-direction: column;
  height: 100dvh;
  overflow: hidden;
}

/* ── Header ── */
.header {
  background: var(--green-deep);
  color: #fff;
  padding: calc(var(--safe-top) + 12px) 16px 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
  box-shadow: 0 2px 12px rgba(0,0,0,0.25);
  z-index: 10;
}
.header-icon { font-size: 26px; }
.header-text h1 { font-size: 18px; font-weight: 600; color: #fff; letter-spacing: -0.3px; }
.header-text p { font-size: 12px; color: rgba(255,255,255,0.65); margin-top: 1px; }
.install-btn {
  margin-left: auto;
  background: rgba(255,255,255,0.15);
  color: #fff;
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 20px;
  padding: 6px 12px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  display: none;
  flex-shrink: 0;
}
.install-btn.visible { display: block; }

/* ── Main layout ── */
.main {
  display: flex;
  flex-direction: column;
  flex: 1;
  overflow: hidden;
  min-height: 0;
}

/* ── Plant grid ── */
.plant-section {
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.plant-scroll {
  display: flex;
  gap: 8px;
  padding: 12px 14px;
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.plant-scroll::-webkit-scrollbar { display: none; }

.plant-chip {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 8px 10px;
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  cursor: pointer;
  flex-shrink: 0;
  transition: all 0.15s;
  min-width: 64px;
  user-select: none;
}
.plant-chip:active { transform: scale(0.95); }
.plant-chip.active {
  background: var(--green-pale);
  border-color: var(--green-mid);
}
.plant-chip-icon { font-size: 24px; }
.plant-chip-label { font-size: 10px; font-weight: 500; color: var(--text-muted); text-align: center; white-space: nowrap; }
.plant-chip.active .plant-chip-label { color: var(--green-deep); }

/* ── Empty state ── */
.empty {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  color: var(--text-muted);
  padding: 2rem;
  text-align: center;
}
.empty-emoji { font-size: 56px; }
.empty h2 { font-size: 18px; font-weight: 600; color: var(--text); }
.empty p { font-size: 14px; line-height: 1.5; }

/* ── Detail panel ── */
.detail { flex: 1; display: flex; flex-direction: column; min-height: 0; }

.plant-hero {
  background: linear-gradient(135deg, var(--green-deep) 0%, var(--green-mid) 100%);
  padding: 14px 16px;
  flex-shrink: 0;
}
.plant-hero h2 { font-size: 20px; font-weight: 700; color: #fff; }
.plant-hero p { font-size: 12px; color: rgba(255,255,255,0.7); margin-top: 3px; line-height: 1.4; }

/* ── Tab bar ── */
.tabs {
  display: flex;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.tab-btn {
  flex: 1;
  padding: 11px 4px;
  font-size: 11px;
  font-weight: 500;
  color: var(--text-faint);
  border: none;
  background: none;
  cursor: pointer;
  border-bottom: 2.5px solid transparent;
  transition: all 0.15s;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}
.tab-btn span.ti { font-size: 18px; }
.tab-btn.active { color: var(--green-deep); border-bottom-color: var(--green-mid); }

/* ── Tab content ── */
.tab-content {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 14px;
  background: var(--bg);
  padding-bottom: calc(var(--safe-bottom) + 14px);
}

/* ── Cards ── */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 10px;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.card-body { padding: 12px 14px; }

.section-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-faint);
  margin-bottom: 8px;
  margin-top: 14px;
}
.section-label:first-child { margin-top: 0; }

/* Water cards */
.water-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
.water-card {
  background: var(--teal-light);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
}
.water-yr { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--teal); margin-bottom: 4px; }
.water-txt { font-size: 13px; color: var(--text); line-height: 1.5; }

/* Moisture indicator */
.moisture-row { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
.moisture-dots { display: flex; gap: 4px; }
.dot { width: 14px; height: 14px; border-radius: 50%; background: var(--border); }
.dot.on { background: var(--teal); }
.moisture-lbl { font-size: 12px; color: var(--text-muted); line-height: 1.4; flex: 1; }

/* Fertilizer */
.fert-row {
  display: flex;
  gap: 10px;
  padding: 9px 0;
  border-bottom: 1px solid var(--border);
  align-items: flex-start;
}
.fert-row:last-child { border-bottom: none; }
.fert-when { font-size: 11px; font-weight: 600; color: var(--amber); min-width: 80px; padding-top: 1px; }
.fert-what { font-size: 13px; color: var(--text); line-height: 1.4; flex: 1; }

/* Pest / disease accordions */
.accord {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 8px;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.accord-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
}
.accord-head:active { background: var(--bg); }
.accord-icon { font-size: 20px; flex-shrink: 0; }
.accord-title { font-size: 14px; font-weight: 600; color: var(--text); flex: 1; }
.accord-badge {
  font-size: 10px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 20px;
  flex-shrink: 0;
}
.badge-high { background: var(--coral-light); color: var(--coral); }
.badge-crit { background: #3a0000; color: #ff6b6b; }
.badge-mod { background: var(--amber-light); color: var(--amber); }
.badge-low { background: var(--green-pale); color: var(--green-deep); }
.accord-chevron { font-size: 16px; color: var(--text-faint); transition: transform 0.2s; flex-shrink: 0; }
.accord.open .accord-chevron { transform: rotate(180deg); }
.accord-body {
  display: none;
  padding: 0 14px 14px;
  border-top: 1px solid var(--border);
}
.accord.open .accord-body { display: block; }

.id-block { margin-top: 10px; }
.id-lbl { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-faint); margin-bottom: 4px; }
.id-txt { font-size: 13px; color: var(--text); line-height: 1.5; background: var(--bg); border-radius: var(--radius-sm); padding: 8px 10px; }

.photo-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin-top: 8px;
  padding: 7px 12px;
  background: var(--blue-light);
  color: var(--blue);
  border: 1px solid rgba(26,95,165,0.2);
  border-radius: 20px;
  font-size: 12px;
  font-weight: 500;
  text-decoration: none;
  cursor: pointer;
}
.photo-btn span { font-size: 14px; }

.tip-list { list-style: none; margin-top: 10px; }
.tip-list li {
  font-size: 13px;
  color: var(--text);
  line-height: 1.5;
  padding: 6px 0 6px 18px;
  border-bottom: 1px solid var(--border);
  position: relative;
}
.tip-list li:last-child { border-bottom: none; }
.tip-list li::before { content: "→"; position: absolute; left: 0; color: var(--green-mid); font-size: 12px; top: 7px; }

.note-box {
  background: var(--amber-light);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  font-size: 12px;
  color: var(--text);
  line-height: 1.5;
  margin-top: 10px;
  display: flex;
  gap: 8px;
}
.note-box span { font-size: 16px; flex-shrink: 0; }
.note-box.green { background: var(--green-pale); }

/* Icons via text */
.icon { display: inline-block; }
</style>
</head>
<body>

<div class="header">
  <div class="header-icon">🌳</div>
  <div class="header-text">
    <h1>Zone 9 Orchard Guide</h1>
    <p>Simonton, TX · Chemical-free care</p>
  </div>
  <button class="install-btn" id="installBtn" onclick="installApp()">＋ Install</button>
</div>

<div class="main">
  <div class="plant-section">
    <div class="plant-scroll" id="plantScroll"></div>
  </div>

  <div id="emptyState" class="empty">
    <div class="empty-emoji">🌱</div>
    <h2>Select a plant above</h2>
    <p>Tap any fruit tree or berry to view its complete care guide — watering, fertilizer, pests, and diseases.</p>
  </div>

  <div id="detailView" class="detail" style="display:none;">
    <div class="plant-hero">
      <h2 id="heroTitle"></h2>
      <p id="heroSub"></p>
    </div>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('water',this)">
        <span>💧</span>Water
      </button>
      <button class="tab-btn" onclick="switchTab('fert',this)">
        <span>🌿</span>Fertilizer
      </button>
      <button class="tab-btn" onclick="switchTab('pests',this)">
        <span>🐛</span>Pests
      </button>
      <button class="tab-btn" onclick="switchTab('disease',this)">
        <span>🍂</span>Disease
      </button>
    </div>
    <div class="tab-content" id="tabContent"></div>
  </div>
</div>

  {id:'pomegranate',label:'Pomegranate'},{id:'apple',label:'Apple'},
  {id:'plum',label:'Plum'},{id:'pear',label:'Pear'},
  {id:'olive',label:'Olive'},{id:'grapefruit',label:'Grapefruit'},
  {id:'orange',label:'Orange'},{id:'apricot',label:'Apricot'},
  {id:'avocado',label:'Avocado'},{id:'blueberry',label:'Blueberry'},
  {id:'blackberry',label:'Blackberry'},{id:'raspberry',label:'Raspberry'},
  {id:'kiwi',label:'Kiwi'}
];

let currentPlant = null;
let currentTab = 'water';

function buildPlantBar() {
  const scroll = document.getElementById('plantScroll');
  PLANTS.forEach(p => {
    const d = DATA[p.id];
    const chip = document.createElement('div');
    chip.className = 'plant-chip';
    chip.id = 'chip-' + p.id;
    chip.innerHTML = `<span class="plant-chip-icon">${d.icon}</span><span class="plant-chip-label">${p.label}</span>`;
    chip.addEventListener('click', () => selectPlant(p.id));
    scroll.appendChild(chip);
  });
}

function selectPlant(id) {
  if (currentPlant) document.getElementById('chip-' + currentPlant).classList.remove('active');
  currentPlant = id;
  document.getElementById('chip-' + id).classList.add('active');
  document.getElementById('chip-' + id).scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});

  const d = DATA[id];
  document.getElementById('heroTitle').textContent = d.icon + ' ' + d.name;
  document.getElementById('heroSub').textContent = d.sub;

  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('detailView').style.display = 'flex';

  document.querySelectorAll('.tab-btn').forEach((t,i) => t.classList.toggle('active', i === 0));
  currentTab = 'water';
  renderTab();
}

function switchTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tabContent').scrollTop = 0;
  renderTab();
}

function renderTab() {
  const d = DATA[currentPlant];
  const el = document.getElementById('tabContent');
  if (currentTab === 'water') el.innerHTML = renderWater(d);
  else if (currentTab === 'fert') el.innerHTML = renderFert(d);
  else if (currentTab === 'pests') el.innerHTML = renderPests(d);
  else el.innerHTML = renderDiseases(d);

  el.querySelectorAll('.accord-head').forEach(h => {
    h.addEventListener('click', () => {
      h.parentElement.classList.toggle('open');
    });
  });
}

function renderWater(d) {
  const dots = Array.from({length:5}, (_,i) =>
    `<div class="dot ${i < d.moisture.level ? 'on' : ''}"></div>`).join('');
  return `
    <div class="section-label">Soil moisture preference</div>
    <div class="card"><div class="card-body">
      <div class="moisture-row">
        <div class="moisture-dots">${dots}</div>
        <div class="moisture-lbl">${d.moisture.label}</div>
      </div>
    </div></div>
    <div class="section-label">Watering schedule</div>
    <div class="water-grid">
      <div class="water-card"><div class="water-yr">🌱 Year 1</div><div class="water-txt">${d.water.yr1}</div></div>
      <div class="water-card"><div class="water-yr">🌿 Year 2</div><div class="water-txt">${d.water.yr2}</div></div>
      <div class="water-card"><div class="water-yr">🌳 Year 3+</div><div class="water-txt">${d.water.mature}</div></div>
    </div>
    <div class="note-box green"><span>💡</span><div>Simonton, TX receives ~45 inches of rain annually, but summer heat demand is extreme. Drip irrigation at the drip line (not the trunk) is strongly recommended for all trees.</div></div>`;
}

function renderFert(d) {
  const rows = d.fert.map(f =>
    `<div class="fert-row"><span class="fert-when">${f.when}</span><span class="fert-what">${f.what}</span></div>`
  ).join('');
  return `
    <div class="section-label">Fertilizer protocol — Zone 9</div>
    <div class="card"><div class="card-body">${rows}</div></div>
    ${d.fertNote ? `<div class="note-box"><span>⚠️</span><div>${d.fertNote}</div></div>` : ''}
    <div class="note-box green" style="margin-top:10px;"><span>🌱</span><div>Organic options: compost, worm castings, blood meal (N), bone meal (P), kelp meal (K+micro), fish emulsion (quick N). Apply 3–4 inch mulch year-round — the highest single ROI habit for your orchard.</div></div>`;
}

function renderPests(d) {
  return `<div class="section-label">Common pests — tap to expand</div>` +
    d.pests.map(p => `
    <div class="accord">
      <div class="accord-head">
        <span class="accord-icon">🐛</span>
        <span class="accord-title">${p.name}</span>
        <span class="accord-badge ${p.sevClass}">${p.sev}</span>
        <span class="accord-chevron">⌄</span>
      </div>
      <div class="accord-body">
        <div class="id-block">
          <div class="id-lbl">How to identify</div>
          <div class="id-txt">${p.id}</div>
          <a class="photo-btn" href="${p.photo}" target="_blank"><span>🔍</span>Search identification photos</a>
        </div>
        <div class="section-label" style="margin-top:12px;">Organic control (no chemicals)</div>
        <ul class="tip-list">${p.tips.map(t=>`<li>${t}</li>`).join('')}</ul>
      </div>
    </div>`).join('');
}

function renderDiseases(d) {
  return `<div class="section-label">Common diseases — tap to expand</div>` +
    d.diseases.map(dis => `
    <div class="accord">
      <div class="accord-head">
        <span class="accord-icon">🍂</span>
        <span class="accord-title">${dis.name}</span>
        <span class="accord-chevron">⌄</span>
      </div>
      <div class="accord-body">
        <div class="id-block">
          <div class="id-lbl">How to identify</div>
          <div class="id-txt">${dis.id}</div>
          <a class="photo-btn" href="${dis.photo}" target="_blank"><span>🔍</span>Search identification photos</a>
        </div>
        <div class="section-label" style="margin-top:12px;">Organic prevention & treatment</div>
        <ul class="tip-list">${dis.tips.map(t=>`<li>${t}</li>`).join('')}</ul>
      </div>
    </div>`).join('');
}

// PWA install
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBtn').classList.add('visible');
});
function installApp() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(() => {
      deferredPrompt = null;
      document.getElementById('installBtn').classList.remove('visible');
    });
  }
}

// Service worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}

buildPlantBar();
</script>
</body>
</html>
